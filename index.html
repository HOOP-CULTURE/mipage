<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HOOP CULTURE</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:'Montserrat',sans-serif; }
body { background:#0a0a0a; color:white; overflow-x:hidden; }
.hero { min-height:100vh; min-height:100svh; background: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.9)), url('https://images.unsplash.com/photo-1546519638-68e109498ffc?q=80&w=2070') center/cover; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:20px; }
.hero h1 { font-size:clamp(42px, 10vw, 80px); font-weight:800; letter-spacing:clamp(2px, 1vw, 5px); }
.hero p { margin-top:15px; font-size:clamp(15px, 4vw, 18px); opacity:0.8; }
.section { padding:clamp(52px, 8vw, 80px) clamp(18px, 6vw, 70px); }
.section h2 { font-size:clamp(28px, 7vw, 38px); margin-bottom:40px; }
.section-note { margin-top:-25px; margin-bottom:35px; max-width:760px; opacity:0.72; line-height:1.7; }
.apparel-section { padding-top:100px; padding-bottom:100px; }
.apparel-section .card { border:1px solid rgba(255,255,255,0.06); }
.apparel-section .gallery img { background:#151515; height:clamp(230px, 52vw, 320px); object-fit:cover; }
.apparel-section .info { min-height:220px; justify-content:space-between; }
.apparel-section .buy { margin-top:auto; }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr)); gap:30px; }
.card { background:#111; border-radius:18px; overflow:hidden; cursor:pointer; transition:0.3s; }
.card:hover { transform:translateY(-10px); box-shadow:0 15px 30px rgba(0,0,0,0.6); }
.gallery { display:flex; overflow-x:auto; scroll-snap-type:x mandatory; scroll-behavior:smooth; }
.gallery img { min-width:100%; height:clamp(230px, 52vw, 320px); object-fit:cover; }
.info { padding:22px; display:flex; flex-direction:column; gap:12px; }
.info h3 { font-size:clamp(21px, 5vw, 26px); }
.desc { opacity:0.7; line-height:1.6; font-size:14px; }
.price { color:#00ff88; font-size:clamp(20px, 5vw, 24px); font-weight:bold; }
.buy { margin-top:10px; background:#00ff88; padding:14px; border-radius:10px; text-align:center; color:black; font-weight:bold; transition:0.3s; }
.buy:hover { background:white; }
footer { background:#000; padding:clamp(20px, 5vw, 35px); text-align:center; opacity:0.7; }

/* MODAL */
.modal { display:none; position:fixed; z-index:999; left:0; top:0; width:100%; height:100%; background:rgba(0,0,0,0.92); overflow:auto; padding:clamp(14px, 4vw, 40px); }
.modal-content { background:#111; max-width:1200px; margin:auto; border-radius:20px; padding:clamp(20px, 5vw, 35px); display:grid; grid-template-columns:1fr 1fr; gap:50px; position:relative; }
.close { position:absolute; top:15px; right:20px; font-size:45px; cursor:pointer; color:#fff; background:rgba(0,0,0,0.8); width:55px; height:55px; border-radius:50%; display:flex; align-items:center; justify-content:center; z-index:1000; box-shadow:0 0 10px rgba(0,0,0,0.5); }
.close:hover { background:rgba(0,0,0,0.95); }
.modal-gallery img { width:100%; border-radius:18px; }
.thumbs { display:flex; gap:10px; margin-top:15px; overflow-x:auto; }
.thumbs img { width:90px; height:90px; object-fit:cover; border-radius:10px; cursor:pointer; padding:5px; background:#000; }
.modal-info h1 { font-size:clamp(32px, 9vw, 55px); }
.modal-price { margin-top:20px; font-size:clamp(25px, 7vw, 35px); color:#00ff88; font-weight:bold; }
.modal-desc { margin-top:20px; line-height:1.8; opacity:0.8; }
.sizes { display:flex; gap:12px; flex-wrap:wrap; margin-top:30px; }
.sizes div { padding:14px 18px; background:#222; border-radius:10px; cursor:pointer; transition:0.3s; }
.sizes div:hover { background:#00ff88; color:black; }
.sizes div.active { background:#00ff88; color:black; }
.buy-modal { margin-top:35px; background:#00ff88; padding:18px; border-radius:12px; text-align:center; font-weight:bold; color:black; cursor:pointer; transition:0.3s; }
.buy-modal:hover { background:white; }

@media(max-width:900px){
.hero { padding:24px 16px; }
.section { padding:48px 18px; }
.section-note { margin-top:-22px; font-size:14px; }
.grid { gap:22px; }
.modal-content { grid-template-columns:1fr; gap:24px; }
.close { top:12px; right:12px; }
}

@media(max-width:520px){
.hero { background-position:center top; }
.hero h1 { line-height:0.95; word-break:break-word; }
.card { border-radius:14px; }
.info { padding:18px; }
.desc { font-size:13px; }
.buy, .buy-modal { padding:13px; }
.modal { padding:10px; }
.modal-content { border-radius:16px; padding:18px; }
.thumbs img { width:72px; height:72px; }
.sizes { gap:9px; }
.sizes div { padding:12px 14px; }
}
</style>
</head>
<body>

<div class="hero">
<h1>HOOP CULTURE</h1>
<p>Todo el estilo del básquet en un solo lugar</p>
</div>

<div class="section">
<h2>Zapatillas de Basket</h2>
<div class="grid">

<div class="card" onclick="openModal('KD 19','S/ 639','¿El mayor don de KD? Su resistencia. Las Slim Reaper nunca se cansan, ni en pasión por el juego ni en energía en los momentos decisivos.','https://static.nike.com/a/images/t_web_pdp_535_v2/f_auto,u_9ddf04c7-2a9a-4d76-add1-d15af8f0263d,c_scale,fl_relative,w_1.0,h_1.0,fl_layer_apply/d75d8065-2cd1-4d34-bf2f-89d30ba8515a/KD19.png','zapatilla')">
<div class="gallery">
<img src="https://static.nike.com/a/images/t_web_pdp_535_v2/f_auto,u_9ddf04c7-2a9a-4d76-add1-d15af8f0263d,c_scale,fl_relative,w_1.0,h_1.0,fl_layer_apply/d75d8065-2cd1-4d34-bf2f-89d30ba8515a/KD19.png">
</div>
<div class="info">
<h3>KD 19</h3>
<p class="desc">Nike Zoom Air Zoom y amortiguación de calidad</p>
<p class="price">S/ 639</p>
<div class="buy">Ver producto</div>
</div>
</div>

<div class="card" onclick="openModal('JA 2','S/ 429','Ja se esfuerza al máximo para ser el mejor y así rendir al máximo cuando el partido está en juego.','https://static.nike.com/a/images/t_PDP_1728_v1/f_auto,q_auto:eco/73d7c99a-68f5-42de-ba12-de61d6001c22/JA+2.png','zapatilla')">
<div class="gallery">
<img src="https://static.nike.com/a/images/t_PDP_1728_v1/f_auto,q_auto:eco/73d7c99a-68f5-42de-ba12-de61d6001c22/JA+2.png">
</div>
<div class="info">
<h3>JA 2</h3>
<p class="desc">Diseño ligero y amortiguación Air Zoom</p>
<p class="price">S/ 429</p>
<div class="buy">Ver producto</div>
</div>
</div>

</div>
</div>

<footer>
<p>&copy; 2024 HOOP CULTURE. Todos los derechos reservados.</p>
</footer>

<!-- MODAL PARA COMPRA -->
<div id="productModal" class="modal">
<div class="modal-content">
<span class="close" onclick="closeModal()">&times;</span>
<div class="modal-gallery">
<img id="mainImage" src="" alt="Producto Principal">
<div class="thumbs" id="thumbsContainer"></div>
</div>
<div class="modal-info">
<h1 id="modalTitle"></h1>
<p class="modal-price" id="modalPrice"></p>
<p class="modal-desc" id="modalDesc"></p>
<div class="sizes" id="sizesContainer"></div>
<button class="buy-modal" onclick="buyWhatsApp()">Comprar por WhatsApp</button>
</div>
</div>
</div>

<script>
let selectedSize = "";
let currentProduct = {};

function openModal(title, price, description, mainImage, type) {
  currentProduct = { title, price, type };
  
  document.getElementById('productModal').style.display = 'block';
  document.getElementById('modalTitle').innerText = title;
  document.getElementById('modalPrice').innerText = price;
  document.getElementById('modalDesc').innerText = description;
  document.getElementById('mainImage').src = mainImage;
  selectedSize = "";
  
  // Reset tamaños
  document.querySelectorAll('.sizes div').forEach(size => { size.classList.remove('active'); });
  
  // Crear thumbnails
  let thumbsHTML = `<img src="${mainImage}" onclick="document.getElementById('mainImage').src='${mainImage}'" style="cursor:pointer;">`;
  document.getElementById('thumbsContainer').innerHTML = thumbsHTML;
  
  // Crear tamaños según tipo
  let sizesHTML = "";
  if (type === "ropa") {
    sizesHTML = `<div onclick="selectSize(this)">S</div><div onclick="selectSize(this)">M</div><div onclick="selectSize(this)">L</div><div onclick="selectSize(this)">XL</div>`;
  } else if (type === "kids") {
    sizesHTML = `<div onclick="selectSize(this)">36</div><div onclick="selectSize(this)">37</div><div onclick="selectSize(this)">38</div><div onclick="selectSize(this)">39</div><div onclick="selectSize(this)">40</div>`;
  } else {
    sizesHTML = `<div onclick="selectSize(this)">39</div><div onclick="selectSize(this)">40</div><div onclick="selectSize(this)">41</div><div onclick="selectSize(this)">42</div><div onclick="selectSize(this)">43</div>`;
  }
  document.getElementById('sizesContainer').innerHTML = sizesHTML;
}

function closeModal() {
  document.getElementById('productModal').style.display = 'none';
}

function selectSize(element) {
  document.querySelectorAll('.sizes div').forEach(size => { size.classList.remove('active'); });
  element.classList.add('active');
  selectedSize = element.innerText;
}

function buyWhatsApp() {
  if (selectedSize === "") {
    alert("Selecciona una talla");
    return;
  }
  let message = `Hola, quiero comprar:\n🏀 Producto: ${currentProduct.title}\n📏 Talla: ${selectedSize}\n💰 Precio: ${currentProduct.price}`;
  let phone = "51970004135";
  let url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
  window.open(url, "_blank");
}

window.onclick = function(event) {
  const modal = document.getElementById('productModal');
  if (event.target == modal) {
    modal.style.display = 'none';
  }
}
</script>

</body>
</html>
